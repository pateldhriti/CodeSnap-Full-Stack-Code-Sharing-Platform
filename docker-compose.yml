version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: codesnap-db
    restart: always
    environment:
      POSTGRES_USER: codesnap_user
      POSTGRES_PASSWORD: codesnap_password
      POSTGRES_DB: codesnap_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
